input:
  path: input.holo
  mode: finite
  start_frame: 0
  end_frame: null
  batch_size: 32
  load_kind: cpu_cached
  tail: error
  max_fps: null
  duration_seconds: null
time:
  method: pca
  window_frames: 32
  batch_windows: 4
  component_begin: 0
  component_end: 16
optics:
  wavelength_m: 8.51e-7
  pixel_pitch_m: 2.0e-5
space:
  method: fresnel
  distance_m: 0.49
aberration:
  enabled: true
  distance_m: 0.49
  subapertures: 5
  average_window: 64
  zernike_modes: [4, 5, 6]
  prefilter: {r_inner: 3, r_outer: 1024, s_inner: 0, s_outer: 1}
  sensor_flatfield_cutoff_m: 0.01
  skip_outside_pupil: false
metrics:
  interval_ms: 1000
  history_batches: 8192
output:
  average_window: 64
  dtype: uint8
  flatfield_cutoff_m: 0.01
  percentile_clip: {min_pct: 0.02, max_pct: 99.98, roi_radius: 0.9}
viewer:
  enabled: true
  max_frames: 16384
  cao_diagnostics: true
graph:
  enabled: true
  log_dir: logs/python
  open_browser: true
queues:
  input_frames: 1024
  preprocessing_windows: 8
  propagation_windows: 8
  corrected_windows: 2
  output_images: 32
