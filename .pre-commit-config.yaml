repos:
  # -------------------------------------------------------------------
  # Add license headers
  # -------------------------------------------------------------------
  - repo: https://github.com/JulesGuillou/addlicense
    rev: "8892756aa8bb17b5955a1cf6d854c8be0ab6cd83"
    hooks:
      - id: addlicense
        name: addlicense
        args:
          - -c
          - "Digital Holography Foundation"
        files: \.(cc|hh|cu|cuh|hxx|cuhxx|py|txt|cmake|json)$
        stages: [ pre-commit ]

  # -------------------------------------------------------------------
  # Apply C++ / CUDA formatting
  # -------------------------------------------------------------------
  - repo: local
    hooks:
      - id: clang-format
        name: clang-format
        entry: clang-format
        language: system
        files: \.(cc|hh|cu|cuh|hxx|cuhxx)$
        args:
          - --style=file
          - -i
        stages: [ pre-commit ]

  # -------------------------------------------------------------------
  # Validate Conventional Commit messages
  # -------------------------------------------------------------------
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.16.3
    hooks:
      - id: commitizen
        stages: [ commit-msg ]
