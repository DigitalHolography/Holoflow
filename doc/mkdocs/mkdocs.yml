site_name: Holoflow
repo_name: DigitalHolography/Holoflow
repo_url: https://github.com/DigitalHolography/Holoflow
edit_uri: edit/main/doc/mkdocs/docs/

nav:
  - Home: index.md
  - About: about.md
  - Coverage: coverage.md
  - References: references.md
  - Glossary: glossary.md

  - Holovibes: 
    - Overview: holovibes/index.md
    - Tasks:
      - Sources:
        - Ametek s710 Euresys Coaxlink Octo: holovibes/tasks/sources/ametek_s710_euresys_coaxlink_octo.md
        - Ametek s711 Euresys Coaxlink QSFP+: holovibes/tasks/sources/ametek_s711_euresys_coaxlink_qsfp+.md
        - Holofile: holovibes/tasks/sources/holofile.md
      - Sinks:
        - Display Tensor: holovibes/tasks/sinks/display_tensor.md
        - Holofile: holovibes/tasks/sinks/holofile.md
      - Synchronous:
        - Angular Spectrum: holovibes/tasks/syncs/angular_spectrum.md
        - Average: holovibes/tasks/syncs/average.md
        - Causal Sliding Average: holovibes/tasks/syncs/causal_sliding_average.md
        - Conversion: holovibes/tasks/syncs/conversion.md
        - Convolution: holovibes/tasks/syncs/convolution.md
        - FFT Shift: holovibes/tasks/syncs/fft_shift.md
        - Filter 2D: holovibes/tasks/syncs/filter2d.md
        - Fresnel Diffraction: holovibes/tasks/syncs/fresnel_diffraction.md
        - Memcpy: holovibes/tasks/syncs/memcpy.md
        - PCA: holovibes/tasks/syncs/pca.md
        - Percentile Clip: holovibes/tasks/syncs/pct_clip.md
        - Registration: holovibes/tasks/syncs/registration.md
        - Reshape: holovibes/tasks/syncs/reshape.md
        - Rotation: holovibes/tasks/syncs/rotation.md
        - STFT: holovibes/tasks/syncs/stft.md
      - Asynchronous:
        - Batch Queue: holovibes/tasks/asyncs/batch_queue.md
        - Dual Reader Batch Queue: holovibes/tasks/asyncs/dual_reader_batch_queue.md
        - Sliding Average: holovibes/tasks/asyncs/sliding_average.md

  - Holoflow:
    - Overview: holoflow/index.md
    - Architecture: holoflow/architecture.md
    - Concepts:
      - Graph And Data Model: holoflow/concepts/graph.md
      - Task Model: holoflow/concepts/tasks.md
      - Tensors And Storage: holoflow/concepts/tensors.md
    - Runtime:
      - Compiler: holoflow/runtime/compiler.md
      - Scheduler: holoflow/runtime/scheduler.md
    - Guides:
      - Authoring Tasks: holoflow/guides/authoring.md
      - Inspection And Debugging: holoflow/guides/inspection.md
  - Curaii: curaii/index.md
  - Holofile: holofile/index.md

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.path
    - navigation.tracking
    - navigation.top
    - navigation.footer
    - content.code.annotate
    - content.code.copy
    - content.code.select
    - content.tooltips
    - content.action.edit
    - content.action.view
    - search.suggest
    - search.highlight
    - toc.integrate

markdown_extensions:
  - abbr
  - attr_list
  - admonition
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.blocks.caption
  - pymdownx.highlight:
      anchor_linenums: true
      linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.snippets:
      auto_append:
        - docs/glossary.md:abbreviations
      check_paths: true

plugins:
  - search
  - mermaid2

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

use_directory_urls: false
