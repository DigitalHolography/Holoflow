name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 180

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release tag
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $expectedTag = "v$version"
          if ($env:GITHUB_REF_NAME -ne $expectedTag) {
              throw "Tag '$env:GITHUB_REF_NAME' does not match VERSION '$expectedTag'."
          }

          git fetch origin main --no-tags
          git merge-base --is-ancestor $env:GITHUB_SHA origin/main
          if ($LASTEXITCODE -ne 0) {
              throw "Release tag must point to a commit contained in origin/main."
          }

      - name: Configure
        run: >
          cmake --preset msvc-multi
          -DFETCHCONTENT_BASE_DIR=C:/.fc
          -DENABLE_BENCHMARKS=OFF
          -DENABLE_DOCUMENTATION=OFF
          -DENABLE_EXAMPLES=OFF

      - name: Build
        run: cmake --build --preset build-Release -j

      - name: Test
        run: ctest --preset test-Release

      - name: Stage install
        shell: pwsh
        run: |
          $stage = Join-Path $env:GITHUB_WORKSPACE "build/stage"
          cmake --install build/msvc-multi --config Release --prefix $stage --component binaries
          cmake --install build/msvc-multi --config Release --prefix $stage --component dependencies

      - name: Validate staged runtime
        run: >
          pwsh -NoProfile -File tools/validate_windows_package.ps1
          -StageDirectory build/stage

      - name: Package
        run: cmake --build --preset build-Release --target package -j

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $tag = "v$version"
          $asset = "build/msvc-multi/Holoflow-$version-win64.exe"
          if (-not (Test-Path -LiteralPath $asset)) {
              throw "Installer was not generated: $asset"
          }

          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
              gh release upload $tag $asset --clobber
          } elseif ($version.Contains("-")) {
              gh release create $tag $asset --verify-tag --title $tag --generate-notes --prerelease
          } else {
              gh release create $tag $asset --verify-tag --title $tag --generate-notes --latest
          }
